services:
  # ============================================
  # Infrastructure Services
  # ============================================

  # PostgreSQL Databases (Schema-per-Service)
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ....
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  farmer-db:
    image: postgres:16-alpine
    container_name: farmer-db
    environment:
      POSTGRES_DB: farmer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ....
    ports:
      - "5450:5432"
    volumes:
      - farmer-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscription-db:
    image: postgres:16-alpine
    container_name: subscription-db
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5451:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kyc-db:
    image: postgres:16-alpine
    container_name: kyc-db
    environment:
      POSTGRES_DB: kyc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5452:5432"
    volumes:
      - kyc-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  field-officer-db:
    image: postgres:16-alpine
    container_name: field-officer-db
    environment:
      POSTGRES_DB: field_officer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5453:5432"
    volumes:
      - field-officer-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-application-db:
    image: postgres:16-alpine
    container_name: job-application-db
    environment:
      POSTGRES_DB: job_applications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5454:5432"
    volumes:
      - job-application-db-data:/var/lib/postgresql/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Microservices (to be added as they are built)
  # ============================================

  # API Gateway
  api-gateway:
    build:
      context: ./java-spring-microservices
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "4004:4004"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For Linux compatibility
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_SERVICES_AUTH_SERVICE=http://auth-service:4005
      - GATEWAY_SERVICES_FARMER_SERVICE=http://farmer-service:4000
      - GATEWAY_SERVICES_FIELD_OFFICER_SERVICE=http://field-officer-service:4015
      - GATEWAY_SERVICES_SUBSCRIPTION_SERVICE=http://subscription-service:4013
      - GATEWAY_SERVICES_KYC_SERVICE=http://kyc-service:4014
      - GATEWAY_SERVICES_NOTIFICATION_SERVICE=http://notification-service:4016
      - GATEWAY_SERVICES_FILE_SERVICE=http://file-service:4008
      - GATEWAY_SERVICES_SUPPORT_SERVICE=http://support-service:4012
      - GATEWAY_SERVICES_JOB_APPLICATION_SERVICE=http://job-application-service:4017
      - GATEWAY_JWT_JWKS_URI=http://auth-service:4005/.well-known/jwks.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Auth Service
  auth-service:
    build:
      context: ./java-spring-microservices
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "4005:4005"
      - "9090:9090"  # gRPC port
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_AUTH_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Farmer Service
  farmer-service:
    build:
      context: ./java-spring-microservices
      dockerfile: farmer-service/Dockerfile
    container_name: farmer-service
    ports:
      - "4000:4000"
    depends_on:
      farmer-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    volumes:
      # Mount entire project root read-only so farmer-service can access Excel files.
      # Use container path /workspace for file-based imports (e.g. filePath=/workspace/Maharashtra.xlsx).
      - /home/omkar/Desktop/Thynktech/krushi-kranti:/workspace:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - SPRING_DATASOURCE_URL=${NEON_DEV_FARMER_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Field Officer Service
  field-officer-service:
    build:
      context: ./java-spring-microservices
      dockerfile: field-officer-service/Dockerfile
    container_name: field-officer-service
    ports:
      - "4015:4015"
    depends_on:
      field-officer-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_FIELD_OFFICER_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4015/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Subscription Service
  subscription-service:
    build:
      context: ./java-spring-microservices
      dockerfile: subscription-service/Dockerfile
    container_name: subscription-service
    ports:
      - "4013:4013"
      - "9093:9093"  # gRPC port
    depends_on:
      subscription-db:
        condition: service_healthy
      farmer-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_SUBSCRIPTION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4013/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # KYC Service
  kyc-service:
    build:
      context: ./java-spring-microservices
      dockerfile: kyc-service/Dockerfile
    container_name: kyc-service
    ports:
      - "4014:4014"
      - "9094:9094"  # gRPC port
    depends_on:
      kyc-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - QUICKEKYC_BASE_URL=${QUICKEKYC_BASE_URL:-https://api.quickekyc.com}
      - SPRING_DATASOURCE_URL=${NEON_DEV_KYC_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4014/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification Service
  notification-service:
    build:
      context: ./java-spring-microservices
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "4016:4016"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_NOTIFICATION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMS_API_URL=${SMS_API_URL}
      - SMS_AUTH_KEY=${SMS_AUTH_KEY}
      - SMS_SENDER_ID=${SMS_SENDER_ID}
      - SMS_ROUTE=${SMS_ROUTE}
      - SMS_COUNTRY=${SMS_COUNTRY}
      - SMS_DLT_TE_ID=${SMS_DLT_TE_ID}
      - SMS_ENABLED=${SMS_ENABLED}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4016/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # File Service
  file-service:
    build:
      context: ./java-spring-microservices
      dockerfile: file-service/Dockerfile
    container_name: file-service
    env_file:
      - ./java-spring-microservices/file-service/.env
    ports:
      - "4008:4008"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Job Application Service
  job-application-service:
    build:
      context: ./java-spring-microservices
      dockerfile: job-application-service/Dockerfile
    container_name: job-application-service
    ports:
      - "4017:4017"
    depends_on:
      job-application-db:
        condition: service_healthy
      file-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_JOB_APPLICATION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4017/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  krushi-kranti-network:
    driver: bridge
    name: krushi-kranti-network

volumes:
  auth-db-data:
  farmer-db-data:
  notification-db-data:
  subscription-db-data:
  kyc-db-data:
  field-officer-db-data:
  job-application-db-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:

