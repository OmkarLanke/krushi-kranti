# Backend - TEST SERVER configuration
# Connects to Neon DB (dev branch) for the test environment.
#
# Usage (on test server):
#   cd microservices
#   docker compose -f docker-compose-test.yml up -d
#
# Differences from docker-compose-local.yml:
#   - No local Postgres DB containers (all services connect to Neon dev branch)
#   - No local-specific volume mounts
#   - Uses .env.test for environment variables
#   - Includes support-service
#
# Spring profile: "docker" (reuses existing application-docker.yml files).
# The test vs local distinction is purely via env vars (which Neon branch).
# If you later need test-specific Spring config (log levels, feature flags),
# create application-test.yml per service and change to: SPRING_PROFILES_ACTIVE=docker,test

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    restart: unless-stopped

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - krushi-kranti-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 30s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Microservices
  # ============================================

  # API Gateway
  api-gateway:
    build:
      context: ./java-spring-microservices
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "4004:4004"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - GATEWAY_SERVICES_AUTH_SERVICE=http://auth-service:4005
      - GATEWAY_SERVICES_FARMER_SERVICE=http://farmer-service:4000
      - GATEWAY_SERVICES_FIELD_OFFICER_SERVICE=http://field-officer-service:4015
      - GATEWAY_SERVICES_SUBSCRIPTION_SERVICE=http://subscription-service:4013
      - GATEWAY_SERVICES_KYC_SERVICE=http://kyc-service:4014
      - GATEWAY_SERVICES_NOTIFICATION_SERVICE=http://notification-service:4016
      - GATEWAY_SERVICES_FILE_SERVICE=http://file-service:4008
      - GATEWAY_SERVICES_SUPPORT_SERVICE=http://support-service:4012
      - GATEWAY_SERVICES_JOB_APPLICATION_SERVICE=http://job-application-service:4017
      - GATEWAY_JWT_JWKS_URI=http://auth-service:4005/.well-known/jwks.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./java-spring-microservices
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "4005:4005"
      - "9090:9090"  # gRPC port
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    env_file:
      - .env.test
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_AUTH_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Farmer Service
  farmer-service:
    build:
      context: ./java-spring-microservices
      dockerfile: farmer-service/Dockerfile
    container_name: farmer-service
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - SPRING_DATASOURCE_URL=${NEON_DEV_FARMER_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Field Officer Service
  field-officer-service:
    build:
      context: ./java-spring-microservices
      dockerfile: field-officer-service/Dockerfile
    container_name: field-officer-service
    ports:
      - "4015:4015"
    depends_on:
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_FIELD_OFFICER_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4015/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Subscription Service
  subscription-service:
    build:
      context: ./java-spring-microservices
      dockerfile: subscription-service/Dockerfile
    container_name: subscription-service
    ports:
      - "4013:4013"
      - "9093:9093"  # gRPC port
    depends_on:
      farmer-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_SUBSCRIPTION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4013/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # KYC Service
  kyc-service:
    build:
      context: ./java-spring-microservices
      dockerfile: kyc-service/Dockerfile
    container_name: kyc-service
    ports:
      - "4014:4014"
      - "9094:9094"  # gRPC port
    depends_on:
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - QUICKEKYC_BASE_URL=${QUICKEKYC_BASE_URL:-https://api.quickekyc.com}
      - SPRING_DATASOURCE_URL=${NEON_DEV_KYC_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4014/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./java-spring-microservices
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "4016:4016"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    env_file:
      - .env.test
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_NOTIFICATION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4016/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # File Service
  file-service:
    build:
      context: ./java-spring-microservices
      dockerfile: file-service/Dockerfile
    container_name: file-service
    env_file:
      - ./java-spring-microservices/file-service/.env.test
    ports:
      - "4008:4008"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Job Application Service
  job-application-service:
    build:
      context: ./java-spring-microservices
      dockerfile: job-application-service/Dockerfile
    container_name: job-application-service
    ports:
      - "4017:4017"
    depends_on:
      file-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_JOB_APPLICATION_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4017/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

  # Support Service
  support-service:
    build:
      context: ./java-spring-microservices
      dockerfile: support-service/Dockerfile
    container_name: support-service
    ports:
      - "4012:4012"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - krushi-kranti-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${NEON_DEV_SUPPORT_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${NEON_DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NEON_DEV_DB_PASSWORD}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=1800000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4012/actuator/health/liveness"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

networks:
  krushi-kranti-network:
    external: true
    name: krushi-kranti-network

volumes:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
