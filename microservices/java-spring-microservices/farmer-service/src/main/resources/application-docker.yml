server:
  port: 4000

spring:
  application:
    name: farmer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://farmer-db:5432/farmer_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # HikariCP optimizations for Neon (serverless Postgres)
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 60000
      pool-name: farmer-service-pool
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 200
        order_inserts: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Kafka Configuration
spring.kafka:
  bootstrap-servers: kafka:9092
  consumer:
    group-id: farmer-service-group
    auto-offset-reset: earliest
    enable-auto-commit: false

# gRPC Client Configuration (to call Auth Service)
grpc:
  client:
    auth-service:
      address: static://auth-service:9090
      negotiationType: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Service URLs for inter-service communication (Docker)
services:
  kyc-service:
    url: http://kyc-service:4014
  subscription-service:
    url: http://subscription-service:4013
  auth-service:
    url: http://auth-service:4005
  field-officer-service:
    url: http://field-officer-service:4015

logging:
  level:
    root: INFO
    com.krushikranti.farmer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

