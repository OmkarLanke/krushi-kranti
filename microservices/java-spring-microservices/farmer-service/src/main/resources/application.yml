server:
  port: 4000

spring:
  application:
    name: farmer-service
  
  datasource:
    url: jdbc:postgresql://localhost:5450/farmer_db
    username: postgres
    password: ....
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 200
        order_inserts: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Kafka Configuration
spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: farmer-service-group
    auto-offset-reset: earliest
    enable-auto-commit: false

# gRPC Client Configuration (to call Auth Service)
grpc:
  client:
    auth-service:
      address: static://localhost:9090
      negotiationType: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Service URLs for inter-service communication
services:
  kyc-service:
    url: http://localhost:4014
  subscription-service:
    url: http://localhost:4013
  auth-service:
    url: http://localhost:4005
  field-officer-service:
    url: http://localhost:4015

# data.gov.in India Post Pincode API
datagovin:
  api:
    key: ${DATAGOVIN_API_KEY:}
    base-url: https://api.data.gov.in/resource
    resource-id: 6176ee09-3d56-4a3b-8115-21841576b2f6
    timeout: 15000
    max-results: 100

# Weather API Configuration
weather:
  api:
    # Base URL for WeatherAPI.com
    base-url: https://api.weatherapi.com/v1
    # API key - Get free key from https://www.weatherapi.com/signup.aspx
    # Replace with your actual key or use environment variable ${WEATHER_API_KEY}
    key: ${WEATHER_API_KEY:your_api_key_here}

# Redis Configuration for distributed caching (master data)
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: 2000ms

# NOTE: Cache configuration is now defined in CacheConfig.java
# - Caffeine (in-memory): currentWeather, weatherForecast (30 min TTL)
# - Redis (distributed): cropTypes, cropNames (1 hour TTL)

logging:
  level:
    root: INFO
    com.krushikranti.farmer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

