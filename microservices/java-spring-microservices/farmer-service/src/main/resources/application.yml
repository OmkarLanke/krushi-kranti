server:
  port: 4000

spring:
  application:
    name: farmer-service
  
  datasource:
    url: jdbc:postgresql://localhost:5450/farmer_db
    username: postgres
    password: ....
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Kafka Configuration
spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: farmer-service-group
    auto-offset-reset: earliest
    enable-auto-commit: false

# gRPC Client Configuration (to call Auth Service)
grpc:
  client:
    auth-service:
      address: static://localhost:9090
      negotiationType: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Service URLs for inter-service communication
services:
  kyc-service:
    url: http://localhost:4014
  subscription-service:
    url: http://localhost:4013
  auth-service:
    url: http://localhost:4005
  field-officer-service:
    url: http://localhost:4015

# Weather API Configuration
weather:
  api:
    # Base URL for WeatherAPI.com
    base-url: https://api.weatherapi.com/v1
    # API key - Get free key from https://www.weatherapi.com/signup.aspx
    # Replace with your actual key or use environment variable ${WEATHER_API_KEY}
    key: ${WEATHER_API_KEY:your_api_key_here}

# Cache Configuration for Weather Data
spring.cache:
  type: caffeine
  cache-names: currentWeather,weatherForecast
  caffeine:
    spec: maximumSize=500,expireAfterWrite=30m

logging:
  level:
    root: INFO
    com.krushikranti.farmer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

