spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://notification-db:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    # HikariCP optimizations for Neon (serverless Postgres)
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 60000
      pool-name: notification-service-pool

  kafka:
    bootstrap-servers: kafka:9092

  # Email Configuration (SMTP) - default to GoDaddy TLS on 587
  mail:
    host: ${MAIL_HOST:smtpout.secureserver.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Application Email Settings
app:
  email:
    from: ${MAIL_FROM:noreply@krushikranti.com}
    from-name: ${MAIL_FROM_NAME:Krushi Kranti}
    reset-password:
      base-url: ${RESET_PASSWORD_BASE_URL:https://krushikranti.com/reset-password}
      deep-link: ${RESET_PASSWORD_DEEP_LINK:krushikranti://reset-password}
      redirect-url: ${RESET_PASSWORD_REDIRECT_URL:}
  sms:
    api-url: ${SMS_API_URL:http://control.bestsms.co.in/api/sendhttp.php}
    auth-key: ${SMS_AUTH_KEY:}
    sender-id: ${SMS_SENDER_ID:THYNKT}
    route: ${SMS_ROUTE:4}
    country: ${SMS_COUNTRY:91}
    dlt-te-id: ${SMS_DLT_TE_ID:1707177212160936245}
    enabled: ${SMS_ENABLED:true}