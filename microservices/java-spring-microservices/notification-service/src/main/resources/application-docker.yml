spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://notification-db:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  
  kafka:
    bootstrap-servers: kafka:9092

  # Email Configuration (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application Email Settings
app:
  email:
    from: ${MAIL_FROM:noreply@krushikranti.com}
    from-name: ${MAIL_FROM_NAME:Krushi Kranti}
    reset-password:
      base-url: ${RESET_PASSWORD_BASE_URL:https://krushikranti.com/reset-password}
      deep-link: ${RESET_PASSWORD_DEEP_LINK:krushikranti://reset-password}
      redirect-url: ${RESET_PASSWORD_REDIRECT_URL:}