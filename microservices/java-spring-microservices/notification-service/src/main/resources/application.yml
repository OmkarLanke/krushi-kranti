server:
  port: 4016

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://localhost:5441/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: notificationEvent:com.krushikranti.notification.events.NotificationEvent
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest
      enable-auto-commit: false

  # Email Configuration (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Application Email Settings
app:
  email:
    from: ${MAIL_FROM:noreply@krushikranti.com}
    from-name: ${MAIL_FROM_NAME:Krushi Kranti}
    reset-password:
      base-url: ${RESET_PASSWORD_BASE_URL:https://krushikranti.com/reset-password}
      deep-link: ${RESET_PASSWORD_DEEP_LINK:krushikranti://reset-password}
  sms:
    api-url: ${SMS_API_URL:http://control.bestsms.co.in/api/sendhttp.php}
    auth-key: ${SMS_AUTH_KEY:}
    sender-id: ${SMS_SENDER_ID:THYNKT}
    route: ${SMS_ROUTE:4}
    country: ${SMS_COUNTRY:91}
    dlt-te-id: ${SMS_DLT_TE_ID:1707177212160936245}
    enabled: ${SMS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.krushikranti.notification: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
