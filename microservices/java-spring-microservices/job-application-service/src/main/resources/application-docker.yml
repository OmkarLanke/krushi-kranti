server:
  port: 4017

spring:
  application:
    name: job-application-service
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  datasource:
    url: jdbc:postgresql://job-application-db:5432/job_applications
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# File Service Configuration (internal Docker network)
file:
  service:
    url: http://file-service:4008

# gRPC Client Configuration (if needed for auth in future)
grpc:
  client:
    auth-service:
      address: static://auth-service:9090
      negotiationType: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.krushikranti.jobapplication: DEBUG
