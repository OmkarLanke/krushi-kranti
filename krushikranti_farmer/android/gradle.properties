org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Use system JAVA_HOME / Gradle toolchains instead of hard-coding a Linux path.
# This makes the project build on both Windows and Linux as long as a compatible
# JDK (17 or higher) is installed and JAVA_HOME is set correctly on each system.
# If you ever need to force a specific JDK, set org.gradle.java.home locally in
# your user-level gradle.properties instead of committing it to the project.