# Frontend - PRODUCTION configuration
# Run from repo root: docker compose -f docker-compose.frontend.yml up --build -d
#
# PRODUCTION settings:
# - BASE_URL: https://api.krushikranti.ltd
# - Nginx: production config with SSL
# - Domains served:
#     Landing:  krushikranti.ltd, www.krushikranti.ltd
#     Admin:    admin.krushikranti.ltd
#     Hiring:   careers.krushikranti.ltd
#     API:      api.krushikranti.ltd

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BASE_URL: https://api.krushikranti.ltd
        APK_FILENAME: krushi-kranti-farmer.apk
        NGINX_CONF: frontend/nginx.conf
    image: krushi-frontend:latest
    container_name: krushi-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - krushi-kranti-network
    restart: unless-stopped

networks:
  krushi-kranti-network:
    external: true
    name: krushi-kranti-network
