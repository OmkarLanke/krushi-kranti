# API proxy - api2.krushikranti.ltd -> API Gateway
server {
    listen 443 ssl;
    http2 on;
    server_name api2.krushikranti.ltd;
    ssl_certificate     /etc/letsencrypt/live/test.krushikranti.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.krushikranti.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 20M;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
}
