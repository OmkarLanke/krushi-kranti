# Krushi Kranti Frontend - TEST SERVER Nginx Config
# Serves: landing (test.krushikranti.ltd), admin (test.admin.krushikranti.ltd),
#         hiring (test.careers.krushikranti.ltd), API proxy (api2.krushikranti.ltd)
# SSL: Mount /etc/letsencrypt from host when running container

upstream api_gateway {
    server api-gateway:4004;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name test.krushikranti.ltd test.admin.krushikranti.ltd test.careers.krushikranti.ltd api2.krushikranti.ltd;
    return 301 https://$host$request_uri;
}

# Landing page - test.krushikranti.ltd
server {
    listen 443 ssl;
    http2 on;
    server_name test.krushikranti.ltd;
    ssl_certificate     /etc/letsencrypt/live/test.krushikranti.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.krushikranti.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html/landing;
    index index.html;

    location ~* \.apk$ {
        add_header Content-Type application/vnd.android.package-archive;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

