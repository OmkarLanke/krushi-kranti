# Krushi Kranti Frontend - Production Nginx Config
# Serves: landing (krushikranti.ltd, www), admin (admin.krushikranti.ltd), API proxy (api.krushikranti.ltd)
# SSL: Mount /etc/letsencrypt from host when running container

# Upstream for API Gateway (same Docker network as backend)
upstream api_gateway {
    server api-gateway:4004;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name krushikranti.ltd www.krushikranti.ltd admin.krushikranti.ltd api.krushikranti.ltd;
    return 301 https://$host$request_uri;
}

# Landing page - krushikranti.ltd & www.krushikranti.ltd
server {
    listen 443 ssl http2;
    server_name krushikranti.ltd www.krushikranti.ltd;
    ssl_certificate     /etc/letsencrypt/live/krushikranti.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krushikranti.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html/landing;
    index index.html;

    # Serve APK files with correct MIME type and force download
    location ~* \.apk$ {
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=krushi-kranti-farmer.apk";
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Admin web app (Flutter SPA) - admin.krushikranti.ltd
server {
    listen 443 ssl http2;
    server_name admin.krushikranti.ltd;
    ssl_certificate     /etc/letsencrypt/live/krushikranti.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krushikranti.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API proxy - api.krushikranti.ltd -> API Gateway
server {
    listen 443 ssl http2;
    server_name api.krushikranti.ltd;
    ssl_certificate     /etc/letsencrypt/live/krushikranti.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krushikranti.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Allow large file uploads (photos, documents, etc.)
    client_max_body_size 20M;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Increase timeouts for large file uploads
        proxy_request_buffering off;
    }
}
