name: krushikranti_admin
description: "Krushi Kranti Admin Portal - Web-focused admin dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time formatting
  intl: ^0.19.0
  
  # Data Tables
  data_table_2: ^2.5.8
  
  # Charts (for dashboard)
  fl_chart: ^0.66.0
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # File Picker
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  remove_alpha_ios: true

